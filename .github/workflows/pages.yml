# Builds secrets.js from the SCRIPT_URL repository secret and publishes the
# survey to GitHub Pages. Runs on every push to main, or manually.
name: Deploy survey to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create secrets.js from the repository secret
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
        run: |
          if [ -z "$SCRIPT_URL" ]; then
            echo "::warning::SCRIPT_URL secret is not set - the survey will only offer downloads."
          fi
          printf 'window.SURVEY_SECRETS = { SCRIPT_URL: "%s" };\n' "$SCRIPT_URL" > secrets.js

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js config.js secrets.js images .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
